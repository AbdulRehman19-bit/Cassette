name: ChangelogCat
description: "Draft user-facing release notes for a tag from its merged PRs. Read-only; publish them with the `publish` action in a separate job."
author: Cassette
branding:
  icon: file-text
  color: purple

inputs:
  api-key:
    description: API key for the model provider (store it as a repository secret).
    required: true
  tag:
    description: The release tag to write notes for.
    default: ${{ github.ref_name }}
  from-tag:
    description: "Compare against this tag. Default: the highest version below `tag`."
    default: ""
  provider:
    description: "groq or anthropic."
    default: groq
  model:
    description: Model id. Default depends on the provider.
    default: ""
  github-token:
    description: "Token the agent reads GitHub with. Keep it read-only (`permissions - contents - read`)."
    default: ${{ github.token }}
  python-version:
    default: "3.12"

outputs:
  notes-file:
    description: Path to the drafted release notes.
    value: ${{ steps.draft.outputs.notes-file }}
  from-tag:
    description: The tag the notes were compared against.
    value: ${{ steps.prev.outputs.from-tag }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ChangelogCat
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH/../.." openai anthropic

    - name: Find the previous tag
      id: prev
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        FROM_TAG: ${{ inputs.from-tag }}
      run: |
        if [ -z "$FROM_TAG" ]; then
          FROM_TAG=$(python -m changelogcat.tags previous --repo "$GITHUB_REPOSITORY" --tag "$TAG")
        fi
        echo "from-tag=$FROM_TAG" >> "$GITHUB_OUTPUT"
        echo "Writing notes for $FROM_TAG..$TAG"

    - name: Draft the notes
      id: draft
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        PYTHONUTF8: "1"
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        GROQ_API_KEY: ${{ inputs.provider == 'groq' && inputs.api-key || '' }}
        ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && inputs.api-key || '' }}
        # The agent reads through the bundled GET-only server with a read-only token: it has no way to write.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        FROM_TAG: ${{ steps.prev.outputs.from-tag }}
        TO_TAG: ${{ inputs.tag }}
      run: |
        [ -z "$MODEL" ] && unset MODEL
        out="$RUNNER_TEMP/release-notes.md"
        python -m changelogcat > "$out"
        if [ ! -s "$out" ]; then echo "::error::ChangelogCat produced no notes"; exit 1; fi
        echo "notes-file=$out" >> "$GITHUB_OUTPUT"
        cat "$out" >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the notes for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: changelogcat-notes
        path: ${{ steps.draft.outputs.notes-file }}
        if-no-files-found: error
