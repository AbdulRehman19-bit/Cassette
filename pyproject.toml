[project]
name = "cassette-cli"
version = "0.0.0"
description = "pytest for agents: record, replay, diff and assert AI agent runs over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.7",
  "pyyaml>=6",
  "click>=8.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
cassette = "cassette.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "types-pyyaml",
    "anthropic>=2.6.0",
    "openai>=3.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassette"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "examples/changelogcat/tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "examples/changelogcat"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
